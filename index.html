<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phoenix</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #3b0a4c, #ff6a00);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      color: #fff4e6;
    }
    @keyframes gradient {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    header {
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.5em;
      margin: 0;
      color: #ffe4b3;
      text-shadow: 1px 1px 4px #000;
    }
    nav {
      text-align: center;
      margin-top: 10px;
    }
    nav a {
      font-family: 'Roboto', sans-serif;
      background: #ff5e3a;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      text-decoration: none;
      margin: 0 5px;
    }
    nav a:hover {
      background: #cc3c1d;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 15px;
    }
    .card {
      background: rgba(0,0,0,0.65);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .card img {
      width: 100%;
      height: auto;
      max-height: 240px;
      object-fit: cover;
      border-radius: 6px;
    }
    .card p {
      color: #ffcc99;
      margin: 10px 0;
    }
    .btn {
      display: inline-block;
      background: #ff5e3a;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
      font-family: 'Roboto', sans-serif;
    }
    .btn:hover {
      background: #cc3c1d;
    }
  </style>
</head>
<body>
  <header>
    <h1>Phoenix</h1>
    <nav>
      <a href="reviews.html">Отзывы</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </header>

  <div class="grid">
    <div class="card">
      <img src="https://placehold.co/400x300/111111/FF6600?text=Товар+1" alt="Product 1">
      <p>🔥 Товар #1 — доступен</p>
      <a class="btn" href="https://t.me/sin_operat" target="_blank">Заказать</a>
    </div>
  </div>
</body>
</html>
