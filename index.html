
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phoenix</title>
  <link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Josefin+Slab:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Josefin Slab', serif;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff4e6;
    }
    header {
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-family: 'Unica One', cursive;
      font-size: 2.5em;
      margin: 0;
      color: #ffe4b3;
      text-shadow: 1px 1px 4px #000;
    }
    nav {
      text-align: center;
      margin-top: 10px;
    }
    nav a {
      font-family: 'Unica One', cursive;
      background: #ff5e3a;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      text-decoration: none;
    }
    nav a:hover {
      background: #cc3c1d;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 15px;
    }
    .card {
      background: rgba(0,0,0,0.65);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .card img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 6px;
    }
    .card p {
      color: #ffcc99;
      margin-top: 10px;
    }
  </style>
</head>
