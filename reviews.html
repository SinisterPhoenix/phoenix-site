<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Отзывы клиентов</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #3b0a4c, #ff6a00);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      color: #fff4e6;
      padding: 15px;
    }
    @keyframes gradient {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    h1 {
      text-align: center;
      color: #ffe4b3;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: rgba(0,0,0,0.65);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .card img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 6px;
    }
    .card p {
      color: #ffcc99;
      margin-top: 10px;
    }
    .back-button {
      display: block;
      width: max-content;
      margin: 40px auto 0;
      background: #ff5e3a;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .back-button:hover {
      background: #cc3c1d;
    }
  </style>
</head>
<body>
  <h1>Отзывы клиентов</h1>
  <div class="grid">
    <div class="card">
      <img src="https://placehold.co/400x300/222222/FF9900?text=Отзыв" alt="Отзыв">
      <p>Комментарий: Всё пришло, как и обещали!</p>
    </div>
  </div>
  <a href="index.html" class="back-button">← Обратно к каталогу</a>
</body>
</html>
