
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Отзывы</title>
  <link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Josefin+Slab:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Josefin Slab', serif;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff4e6;
      padding: 15px;
    }
    h1 {
      text-align: center;
      font-family: 'Unica One', cursive;
      color: #ffe4b3;
      margin-bottom: 20px;
    }
    .card {
      background: rgba(0,0,0,0.65);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .card img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 6px;
    }
    .card p {
      color: #ffcc99;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Отзывы клиентов</h1>
  {"".join(f'''
  <div class="card">
    <img src="https://placehold.co/400x300/222222/FF9900?text=Отзыв+{i}" alt="Отзыв {i}">
    <p>Комментарий #{i}: Всё пришло, как и обещали!</p>
  </div>
  ''' for i in range(1, 31))}
</body>
</html>
